name = "blvm-governance"
version = "0.1.4"
description = "Optional governance webhook. Posts to a URL, or forwards block posts to blvm-commons."
author = "Bitcoin Commons Team"
entry_point = "blvm-governance"

capabilities = [
    "read_blockchain",
    "subscribe_events",
]

[config_schema]
webhook_url = "Where this node posts. Leave empty to stay quiet."
listen = "Proxy bind address. Unset means this process does not listen."
commons_url = "blvm-commons base URL. Block posts go to /webhooks/block."

